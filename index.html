<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Automation Studio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b132b;
      color: #ffffff;
      text-align: center;
      padding: 60px 20px;
      margin: 0;
    }
    .card {
      max-width: 600px;
      margin: 0 auto;
      background: #1c2541;
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    h1 {
      color: #00e5ff;
      font-size: 32px;
      margin-bottom: 12px;
    }
    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
    }
    .links {
      margin-top: 36px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    a {
      color: #00e5ff;
      text-decoration: none;
      font-weight: 700;
      padding: 10px 20px;
      border: 1px solid #00e5ff;
      border-radius: 12px;
      transition: all 0.2s;
    }
    a:hover {
      background: #00e5ff;
      color: #0b132b;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Content Automation Studio</h1>
    <p>Plataforma automatizada para la creación y distribución de videos educativos e históricos en formato vertical para TikTok y YouTube Shorts.</p>
    <div class="links">
